<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Salud.uy - Alta de Clínica</title>
    <link rel="icon" type="image/png" href="../img/FAVICON.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../styles/singup_styles.css">
</head>

<body class="alta-clinica">

    <header class="border-bottom bg-white px-4 py-3">
        <nav class="d-flex flex-wrap justify-content-between align-items-center gap-3">

            <a href="../home/indexMedico.html">
                <img src="../img/LOGOGENERAL.png" alt="salud.uy" width="150">
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="../index.html" class="btn btn-secondary">
                    Cerrar sesión
                </a>

                <img src="../img/MEDICO.png" alt="Perfil médico" class="rounded-circle border" width="40" height="40">

                <span class="fw-bold">ana.perez</span>
            </div>

        </nav>
    </header>

    <main class="container panel-registro">
        <h1 class="mb-3">Alta de Clínica</h1>

        <p>
            Los campos marcados con
            <span class="text-danger">*</span>
            son obligatorios.
        </p>

        <form action="../home/indexMedico.html" method="get">

            <h2 class="h5 mt-4 mb-3">Datos de la clínica</h2>

            <div class="mb-3">
                <label for="nombreClinica" class="form-label">
                    Nombre de la clínica
                    <span class="text-danger">*</span>
                </label>

                <input type="text" id="nombreClinica" name="nombreClinica" class="form-control" aria-describedby="ayudaNombre" required>

                <div id="ayudaNombre" class="form-text">
                    El nombre debe ser único en la plataforma.
                </div>
            </div>

            <div class="mb-3">
                <label for="descripcion" class="form-label">
                    Descripción <span class="text-danger">*</span>
                </label>

                <textarea id="descripcion" name="descripcion" class="form-control" rows="3" required></textarea>
            </div>

            <div class="mb-3">
                <label for="direccion" class="form-label">
                    Dirección <span class="text-danger">*</span>
                </label>

                <input type="text" id="direccion" name="direccion" class="form-control" placeholder="Calle, número y localidad" required>
            </div>

            <h2 class="h5 mt-4 mb-3">Costos</h2>

            <div class="mb-3">
                <label for="costoTicket" class="form-label">
                    Costo del ticket de medicamento
                    <span class="text-danger">*</span>
                </label>

                <input type="number" id="costoTicket" name="costoTicket" class="form-control" min="0" step="0.01" required>
            </div>

            <div class="mb-3">
                <label for="costoOrden" class="form-label">
                    Costo de la orden de consulta médica
                    <span class="text-danger">*</span>
                </label>

                <input type="number" id="costoOrden" name="costoOrden" class="form-control" min="0" step="0.01" required>
            </div>

            <h2 class="h5 mt-4 mb-3">Información adicional</h2>

            <div class="mb-3">
                <label for="sitioWeb" class="form-label">
                    Sitio web (opcional)
                </label>

                <input type="url" id="sitioWeb" name="sitioWeb" class="form-control" placeholder="https://www.ejemplo.com">
            </div>

            <div class="mb-4">
                <label for="imagen" class="form-label">
                    Imagen de la clínica (opcional)
                </label>

                <input type="file" id="imagen" name="imagen" class="form-control" accept="image/*">
            </div>

            <div class="d-flex justify-content-end gap-3">
                <a href="../home/indexMedico.html" class="btn btn-secondary">
                    Cancelar
                </a>

                <button type="submit" class="btn btn-primary">
                    Registrar clínica
                </button>
            </div>

        </form>
    </main>

</body>
</html>
