<!DOCTYPE html>
<html>
    <head>
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <link rel="stylesheet" href="../../styles/login_styles.css">
          <script src="../../scripts/login_scripts.js" defer></script>
    </head>
    <body>
        <main>
            <div class="centered--box">
                <div class="title--box">
                    <h1>Ingresar</h1>
                </div>
                <div class="form--box">
                    <form >
                        <div class="textfield_label--container" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                            <label for="username">Cédula de Identidad:</label>
                            <input name="username" class="form--field" id="form--id--textfield" type="text" placeholder="12345678">
                        </div>
                        <div class="textfield_label--container" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
                            <label for="pw">Contraseña:</label>
                            <input name="pw" class="form--field" id="form--email--textfield" type="password">
                        </div>
                        <div class="submit--container">
                            <input id="form--submit" value="Entrar" type="submit">
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </body>
</html>
