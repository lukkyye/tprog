<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Alta de Especialidad</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<header class="mb-2">

    <nav class="navbar navbar-expand-lg" style="width: 100%;">

        <div class="container-fluid d-flex justify-content-between align-items-center">

            <a class="navbar-brand" href="../index.html">
                <img src="../img/LOGOGENERAL.png" width="120px">
            </a>

            <form class="d-flex mx-auto" style="max-width: 500px; width: 100%;">

                <input class="form-control me-2"
                       type="search"
                       placeholder="Buscar..."
                       aria-label="Buscar">

                <button class="btn btn-outline-success" type="submit">
                    Buscar
                </button>

            </form>

             <div class="d-flex flex-row user-section gap-1 align-items-center">
                        <button class="btn btn-secondary">Cerrar Sesión</button>
                        <button class="btn btn-primary">Mis Datos</button>
                        <img style="height: 38px;" src="../img/MEDICO.png">
                    </div>

        </div>

    </nav>

    <hr class="text-black m-0">

</header>


<main class="container py-5">

    <h1 class="mb-4">Alta de Especialidad</h1>


    <form action="altaEspecialidadMedico.html" method="get">

        <div class="mb-3">

            <label for="nombreEspecialidad" class="form-label">
                Nombre de la especialidad:
            </label>

            <input type="text"
                   id="nombreEspecialidad"
                   name="nombreEspecialidad"
                   class="form-control"
                   placeholder="Ingrese el nombre de la especialidad">

        </div>


        <div class="mb-4">

            <label for="porcentaje" class="form-label">
                Porcentaje adicional para el costo de consultas:
            </label>

            <input type="number"
                   id="porcentaje"
                   name="porcentaje"
                   class="form-control"
                   min="0"
                   step="0.01"
                   placeholder="Ingrese el porcentaje">

        </div>


        <button type="submit"
                class="btn btn-primary">
            Dar de alta
        </button>

        <a href="/home/indexMedico.html"
           class="btn btn-secondary ms-2">
            Cancelar
        </a>

    </form>

</main>

</body>

</html>
