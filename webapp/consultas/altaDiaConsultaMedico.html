<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Alta de beneficio anual | salud.uy</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>
    <header class="border-bottom bg-white px-4 py-3">
        <nav class="d-flex justify-content-between align-items-center">
            <a href="../home/indexMedico.html">
                <img src="../img/LOGOGENERAL.png"
                     alt="salud.uy" width="150">
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="../index.html" class="btn btn-secondary">
                    Cerrar sesión
                </a>
                <img src="../img/MEDICO.png"
                     alt="Perfil médico" width="40">
                <span class="fw-bold">ana.perez</span>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <section class="bg-light rounded-4 shadow p-4 p-sm-5 mx-auto"
                 style="max-width: 760px;">

            <h1 class="h2 fw-bold mb-3">Alta Dia Consulta</h1>

            <p class="text-secondary">
                Nuevo Dia de Consulta.
            </p>

            <p>
                Los campos marcados con
                <span class="text-danger">*</span>
                son obligatorios.
            </p>

            <form action="altaDiaConsultaMedicoConfirmado.html" method="get">

                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre <span class="text-danger">*</span>
                    </label>
                    <input type="text" id="nombre" name="nombre"
                        class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="desc" class="form-label">
                        Descripción
                    </label>
                    <input type="text" id="desc" name="desc"
                        class="form-control">
                </div>
                <div class="mb-3">
                    <label for="clinica" class="form-label">
                        Clinica <span class="text-danger">*</span>
                    </label>

                    <select id="clinica" name="clinica"
                            class="form-select" required>
                        <option value="" selected disabled>
                            Seleccioná una especialidad
                        </option>
                        <option value="csmu">
                            CASMU
                        </option>
                        <option value="bh">
                            Hospital Británico
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="especialidad" class="form-label">
                        Especialidad <span class="text-danger">*</span>
                    </label>

                    <select id="especialidad" name="especialidad"
                            class="form-select" required>
                        <option value="" selected disabled>
                            Seleccioná una especialidad
                        </option>
                        <option value="cardiologia">
                            Cardiología
                        </option>
                        <option value="pediatria">
                            Pediatría
                        </option>
                        <option value="mas">
                            Medicina General
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="paciente" class="form-label">
                        Dia <span class="text-danger">*</span>
                    </label>

                    <select id="paciente" name="paciente"
                            class="form-select" required>
                        <option value="" selected disabled>
                            Seleccioná un día.
                        </option>
                        <option value="lunes">
                            Lunes
                        </option>
                        <option value="martes">
                            Martes
                        </option>
                        <option value="miercoles">
                            Miercoles
                        </option>
                        <option value="jueves">
                            Jueves
                        </option>
                        <option value="viernes">
                            Viernes
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="ordenes" class="form-label">
                        Hora de inicio
                        <span class="text-danger">*</span>
                    </label>

                    <input type="time" id="time" name="time"
                           class="form-control"
                           min="07:00" step="1800" required>
                </div>
                <div class="mb-4">
                    <label for="imagen" class="form-label">
                        Imagen (opcional)
                    </label>
                    <input type="file" id="imagen" name="imagen"
                        class="form-control" accept="image/*">
                </div>
                <div class="d-flex justify-content-end gap-3">
                    <a href="../home/indexMedico.html"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Confirmar alta
                    </button>
                </div>

            </form>
        </section>
    </main>
</body>
</html>
