<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Alta de beneficio anual | salud.uy</title>
    <link rel="icon" type="image/png" href="../img/FAVICON.png">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>
    <header class="border-bottom bg-white px-4 py-3">
        <nav class="d-flex justify-content-between align-items-center">
            <a href="../home/indexMedico.html">
                <img src="../img/LOGOGENERAL.png"
                     alt="salud.uy" width="150">
            </a>

            <div class="d-flex align-items-center gap-3">
                <a href="../index.html" class="btn btn-secondary">
                    Cerrar sesión
                </a>
                <img src="../img/MEDICO.png"
                     alt="Perfil médico" width="40">
                <span class="fw-bold">ana.perez</span>
            </div>
        </nav>
    </header>

    <main class="container py-5">
        <section class="bg-light rounded-4 shadow p-4 p-sm-5 mx-auto"
                 style="max-width: 760px;">

            <h1 class="h2 fw-bold mb-3">Alta de beneficio anual</h1>

            <p class="text-secondary">
                Seleccioná un paciente e indicá los beneficios
                que le corresponden para el año.
            </p>

            <p>
                Los campos marcados con
                <span class="text-danger">*</span>
                son obligatorios.
            </p>

            <form action="beneficioConfirmado.html" method="get">

                <div class="mb-3">
                    <label for="paciente" class="form-label">
                        Paciente <span class="text-danger">*</span>
                    </label>

                    <select id="paciente" name="paciente"
                            class="form-select" required>
                        <option value="" selected disabled>
                            Seleccioná un paciente
                        </option>
                        <option value="lucia.panizzi">
                            Lucía Panizzi — lucia.panizzi
                        </option>
                        <option value="juan.gomez">
                            Juan Gómez — juan.gomez
                        </option>
                        <option value="maria.rodriguez">
                            María Rodríguez — maria.rodriguez
                        </option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="anio" class="form-label">
                        Año <span class="text-danger">*</span>
                    </label>

                    <input type="number" id="anio" name="anio"
                           class="form-control"
                           placeholder="Ejemplo: 2026"
                           min="1" step="1" required>
                </div>

                <div class="mb-3">
                    <label for="ordenes" class="form-label">
                        Cantidad de órdenes de consultas gratuitas
                        <span class="text-danger">*</span>
                    </label>

                    <input type="number" id="ordenes" name="ordenes"
                           class="form-control"
                           min="0" step="1" required>
                </div>

                <div class="mb-4">
                    <label for="tickets" class="form-label">
                        Cantidad de tickets de medicamentos gratuitos
                        <span class="text-danger">*</span>
                    </label>

                    <input type="number" id="tickets" name="tickets"
                           class="form-control"
                           min="0" step="1" required>
                </div>

                <div class="d-flex justify-content-end gap-3">
                    <a href="../home/indexMedico.html"
                       class="btn btn-secondary">
                        Cancelar
                    </a>

                    <button type="submit" class="btn btn-primary">
                        Confirmar alta
                    </button>
                </div>

            </form>
        </section>
    </main>
</body>
</html>
